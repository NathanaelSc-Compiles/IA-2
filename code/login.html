<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Coding Conf Registration</title>
        <link rel="stylesheet" href="../styles.css">
    </head>
    <body>
        <h1>Your Coding Conf Adventure Awaits!</h1>
        
        <form name="register" action="reg.aspx" method="post">
            <fieldset>
            <legend>Profile Picture</legend>
            <input id="userP" type="file" name="tb1" /> <br/>
            </fieldset> <br/>

            <fieldset>
            <legend>Personal Information</legend>
            <label>Full Name </label><br/>
            <input  id="userN" type="text" name="tb2" maxlength="10" minleght="2" placeholder="Eg: John Doe" required  /><br/><br/>

            <label>Email</label><br/>
            <input id="userE" type="email" name="tb3" placeholder="Eg: condingconf@gmail.com" required /><br/><br/>

            <label>GitHub Username (Must include @)</label><br/>
            <input id="userG" type="text" name="tb4" required value="@"/><br/><br/>


            <input type="button" onclick="store()" value="Generate Ticket"/>
            
            </fieldset>
        </form>
        
         
    </body>
    <script type="text/javascript" >
            const uName = document.getElementById("userN");
            const uEmail = document.getElementById("userE");
            const uGithub = document.getElementById("userG");
            const uPic = document.getElementById("userP");
            
            function store()
            {
                //const val1 = uPic.value;
                const val2 = uName.value;
                const val3 = uEmail.value;
                const val4 = uGithub.value;

                //console.log(val1);
                console.log(val2);
                console.log(val3);
                console.log(val4);

               //localStorage.setItem("Profile Picture", JSON.stringify(val1));  Need to stringify
                localStorage.setItem('username', JSON.stringify(val2));
                localStorage.setItem("email", JSON.stringify(val3));
                localStorage.setItem("github", JSON.stringify(val4));
                console.log(location.href);
                location.href = "../IA2/ticket.html";
            }; </script>
</html>
